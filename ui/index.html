<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata Launcher</title>
<style>
:root {
  --bg: #0a0e17; --card: rgba(255,255,255,.04); --line: rgba(255,255,255,.08);
  --fg: #e6ebf4; --muted: #8b95a8; --cyan: #22d3ee; --violet: #8b5cf6;
  --green: #34d399; --amber: #fbbf24; --red: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg); min-height: 100vh;
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(60rem 40rem at 12% -8%, rgba(34,211,238,.20), transparent 60%),
    radial-gradient(55rem 45rem at 92% 112%, rgba(139,92,246,.22), transparent 60%),
    radial-gradient(35rem 25rem at 75% 8%, rgba(56,189,248,.08), transparent 65%),
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: auto, auto, auto, 40px 40px, 40px 40px;
}
body::after {
  content: ""; position: fixed; inset: -30%; z-index: -2; pointer-events: none;
  background: radial-gradient(28rem 22rem at 30% 40%, rgba(34,211,238,.07), transparent 60%),
              radial-gradient(30rem 24rem at 70% 60%, rgba(139,92,246,.08), transparent 60%);
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px 64px; }

header { display: flex; align-items: center; justify-content: space-between;
  padding: 28px 0 22px; gap: 16px; flex-wrap: wrap;
  border-bottom: 1px solid transparent; border-image: linear-gradient(90deg,
  rgba(34,211,238,.4), rgba(139,92,246,.4), transparent) 1; }
.brand h1 { font-size: 22px; letter-spacing: .02em; }
.brand h1 em { font-style: normal; background: linear-gradient(90deg, var(--cyan), var(--violet));
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand p { color: var(--muted); font-size: 13px; letter-spacing: .12em; text-transform: lowercase; }
.lamp { display: flex; align-items: center; gap: 9px; padding: 8px 16px;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px; font-size: 14px; }
.lamp .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.lamp.ready .dot { background: var(--green); }
.lamp.loading .dot { background: var(--amber); }
.lamp.error .dot { background: var(--red); }

section { margin-top: 30px; }
section > h2 { font-size: 13px; font-weight: 600; color: var(--muted);
  letter-spacing: .14em; text-transform: uppercase; margin-bottom: 12px; }
.card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.35);
  transition: border-color .2s, transform .2s, box-shadow .2s; }
.card::before { content: ""; position: absolute; inset: -1px; border-radius: 17px; padding: 1px;
  background: linear-gradient(120deg, rgba(34,211,238,.5), rgba(139,92,246,.5), transparent 60%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: 0; transition: opacity .25s; pointer-events: none; }
.card:hover { border-color: rgba(255,255,255,.18); transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(34,211,238,.10), 0 12px 40px rgba(139,92,246,.10), 0 8px 30px rgba(0,0,0,.4); }
.card:hover::before { opacity: 1; }

.banner { padding: 12px 18px; border-radius: 12px; border: 1px solid; margin-bottom: 14px; font-size: 14px; }
.banner.ok { border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.08); color: var(--green); }
.banner.bad { border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.07); color: #fca5a5; }
.banner li { margin: 4px 0 0 20px; }
.envgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 12px; }
.kv { padding: 14px 16px; }
.kv b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
.kv span { font-size: 14px; word-break: break-all; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap: 14px; }
.pcard h3 { font-size: 18px; margin-bottom: 6px; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px;
  border: 1px solid; }
.badge.quant { border-color: rgba(34,211,238,.4); background: rgba(34,211,238,.12); color: var(--cyan); }
.badge.loading { border-color: rgba(251,191,36,.4); background: rgba(251,191,36,.12); color: var(--amber); }
.badge.ready  { border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.12); color: var(--green); }
.badge.stopped, .badge.exited { border-color: rgba(139,149,168,.4); background: rgba(139,149,168,.12); color: var(--muted); }
.badge.error  { border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.12); color: #fca5a5; }
.path { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace;
  word-break: break-all; margin: 8px 0 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.result { margin-top: 12px; font-size: 13px; font-family: ui-monospace, Consolas, monospace;
  color: var(--muted); white-space: pre-wrap; word-break: break-all; }
.result.err { color: #fca5a5; }

button { font: inherit; font-size: 14px; border-radius: 10px; padding: 8px 20px; cursor: pointer;
  border: 1px solid transparent; transition: transform .15s, box-shadow .15s, border-color .15s, background .15s; }
button:disabled { opacity: .45; cursor: default; }
button:not(:disabled):hover { transform: translateY(-1px); }
button:not(:disabled):active { transform: translateY(0); }
.primary { color: #fff; background: linear-gradient(90deg, var(--cyan), var(--violet));
  position: relative; overflow: hidden; box-shadow: 0 2px 12px rgba(101,120,240,.25); }
.primary::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
  background: linear-gradient(105deg, transparent, rgba(255,255,255,.35), transparent);
  transform: skewX(-20deg); transition: left .4s ease; }
.primary:not(:disabled):hover { box-shadow: 0 4px 24px rgba(101,120,240,.55); }
.primary:not(:disabled):hover::after { left: 120%; }
.ghost { background: transparent; border-color: var(--line); color: var(--fg); }
.ghost:not(:disabled):hover { border-color: rgba(255,255,255,.3); }
.danger { background: transparent; border-color: rgba(239,68,68,.5); color: var(--red); }
.danger:not(:disabled):hover { background: rgba(239,68,68,.15); }

.rungrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px,1fr)); gap: 14px; }
.rcard { display: grid; gap: 10px; }
.rcard .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rcard .top b { font-size: 18px; }
.rcard .m { font-size: 15px; word-break: break-all; }
.metrics { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.metrics b { color: var(--fg); font-variant-numeric: tabular-nums; }
a.api { color: var(--cyan); text-decoration: none; word-break: break-all; }
a.api:hover { text-decoration: underline; }
.small { font-size: 12px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
.empty { padding: 22px; text-align: center; color: var(--muted); font-size: 14px; }

details.json { margin-top: 30px; }
details.json summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted);
  letter-spacing: .14em; text-transform: uppercase; margin-bottom: 12px; }
details.json pre { background: #070a12; border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; overflow: auto; max-height: 420px;
  font: 12px/1.7 ui-monospace, Consolas, monospace; color: #9fb0c8; }

@media (prefers-reduced-motion: no-preference) {
  .lamp.ready .dot, .badge.ready { animation: breathe 2.2s ease-in-out infinite; }
  .lamp.loading .dot, .badge.loading { animation: breathe 1.1s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; box-shadow: 0 0 0 4px rgba(255,255,255,.04); } }
  body::after { animation: drift 26s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate3d(4%, -3%, 0) scale(1.08); } }
}
@media (max-width: 640px) { .grid, .rungrid, .envgrid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <h1><em>Strata</em> Launcher</h1>
    <p>local inference console</p>
  </div>
  <div class="lamp" id="lamp"><span class="dot"></span><span id="lampText">探测中</span></div>
</header>

<section>
  <h2>环境</h2>
  <div id="doctor"><div class="card empty">正在检查环境…</div></div>
</section>

<section>
  <h2>运行状态</h2>
  <div id="runs"><div class="card empty">还没有运行中的引擎。</div></div>
</section>

<section>
  <h2>模型配置</h2>
  <div id="profiles"><div class="card empty">正在读取配置…</div></div>
</section>

<details class="json">
  <summary>原始 JSON</summary>
  <pre id="jsonLog">（尚无调用记录）</pre>
</details>
</div>

<script>
const $ = (tag, cls, text) => {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
};
const jsonLog = document.getElementById('jsonLog');
let jsonEntries = [];
function logJson(what, body) {
  jsonEntries.unshift({t: new Date().toLocaleTimeString(), [what]: body});
  jsonEntries = jsonEntries.slice(0, 20);
  jsonLog.textContent = jsonEntries.map(e => JSON.stringify(e, null, 1)).join('\n');
}
async function api(method, url) {
  const res = await fetch(url, {method});
  let body = null;
  try { body = await res.json(); } catch { body = {ok: false, error: `HTTP ${res.status}, 非 JSON 响应`}; }
  logJson(url, body);
  if (!res.ok || body?.ok === false) throw new Error(body?.error ?? `HTTP ${res.status}`);
  return body;
}
function busy(button, on, label) {
  if (on) { button.dataset.label = button.textContent; button.textContent = '…'; button.disabled = true; }
  else { button.textContent = label ?? button.dataset.label; button.disabled = false; }
}

/* 顶栏状态灯 */
let lampState = null;
function setLamp(state) {
  if (state === lampState) return;
  lampState = state;
  const lamp = document.getElementById('lamp');
  lamp.className = 'lamp ' + (state ?? '');
  const names = {loading: '引擎加载中', ready: '引擎就绪', stopped: '已停止', exited: '已退出', error: '异常'};
  document.getElementById('lampText').textContent = names[state] ?? '无运行中的引擎';
}

/* 环境 */
async function loadDoctor() {
  const box = document.getElementById('doctor');
  box.textContent = '';
  const res = await fetch('/api/doctor');
  const report = await res.json().catch(() => null);
  logJson('/api/doctor', report);
  if (!report || (!report.problems && report.ok === false)) {
    box.appendChild($('div', 'banner bad')).append(document.createTextNode(report?.error ?? `HTTP ${res.status}`));
    return;
  }
  const banner = $('div', report.ok ? 'banner ok' : 'banner bad', report.ok ? '环境就绪' : '存在阻塞问题');
  box.appendChild(banner);
  if (!report.ok && Array.isArray(report.problems) && report.problems.length) {
    const ul = $('ul');
    for (const p of report.problems) {
      const li = $('li');
      li.appendChild($('span', 'badge error', p.section ?? '错误'));
      li.append(document.createTextNode(' ' + (p.error ?? '')));
      ul.appendChild(li);
    }
    banner.appendChild(ul);
  }
  const grid = $('div', 'envgrid');
  const env = report.environment ?? {};
  const facts = [
    ['Node', env.node ?? '?'],
    ['平台', env.platform ?? '?'],
    ['配置文件', report.config?.exists ? '已配置' : '未配置（见 README）'],
    ['引擎目录', report.deployment?.engine ? (report.deployment.engineExists === false ? '缺失' : '已找到') : '未配置'],
    ['psutil', report.python?.psutil === true ? '可用' : (report.python ? '不可用' : '未探测')],
    ['运行中的引擎', (report.engines?.names ?? []).join(', ') || '无'],
  ];
  for (const [k, v] of facts) {
    const c = $('div', 'card kv');
    c.appendChild($('b', null, k));
    c.appendChild($('span', null, String(v)));
    grid.appendChild(c);
  }
  box.appendChild(grid);
}

/* 运行状态 */
const runTimers = new Map();
async function loadRuns() {
  let runs = [];
  try { runs = await api('GET', '/api/runs'); } catch { return; }
  if (!Array.isArray(runs)) runs = [];
  const box = document.getElementById('runs');
  box.textContent = '';
  setLamp(runs.length ? (runs.some(r => r.state === 'error') ? 'error'
    : runs.some(r => r.state === 'loading') ? 'loading' : 'ready') : null);
  const live = new Set(runs.map(r => r.id));
  for (const [id, timer] of runTimers) if (!live.has(id)) { clearInterval(timer); runTimers.delete(id); }
  if (!runs.length) { box.appendChild($('div', 'card empty', '还没有运行中的引擎。')); return; }
  const grid = $('div', 'rungrid');
  for (const run of runs) { grid.appendChild(runCard(run)); if (!runTimers.has(run.id)) pollRun(run.id); }
  box.appendChild(grid);
}
function runCard(run) {
  const card = $('div', 'card rcard');
  card.id = 'run-' + run.id;
  card.appendChild($('div', 'small', 'RUN ' + run.id));
  const top = $('div', 'top');
  const badge = $('span', 'badge ' + (run.state ?? ''), run.state ?? 'loading');
  top.appendChild($('b', null, run.model ?? ''));
  top.appendChild(badge);
  card.appendChild(top);
  card.appendChild($('div', 'metrics', ''));
  card.appendChild($('div', 'm'));
  const actions = $('div', 'row');
  const stop = $('button', 'danger', '停止');
  stop.onclick = async () => {
    busy(stop, true, '停止');
    try { await api('POST', '/api/stop?id=' + encodeURIComponent(run.id)); }
    catch (error) { busy(stop, false, '停止'); showError(card, error.message); }
  };
  actions.appendChild(stop);
  card.appendChild(actions);
  return card;
}
function showError(card, message) {
  let r = card.querySelector('.result');
  if (!r) { r = $('div', 'result err'); card.appendChild(r); }
  r.textContent = message;
}
async function pollRun(id) {
  const tick = async () => {
    const card = document.getElementById('run-' + id);
    if (!card) { clearInterval(runTimers.get(id)); runTimers.delete(id); return; }
    let snap;
    try { snap = await api('GET', '/api/status?id=' + encodeURIComponent(id)); }
    catch { return; }
    const status = snap.status;
    const state = status?.state ?? 'loading';
    const badge = card.querySelector('.badge');
    badge.className = 'badge ' + state; badge.textContent = state;
    card.querySelector('.m').textContent =
      `端口 ${snap.port ?? '?'} · ` + new Date().toLocaleTimeString() + ' 更新' +
      (status?.exitCode !== undefined ? ` · 退出码 ${status.exitCode}` : '') +
      (status?.error ? ` · ${status.error}` : '') +
      (status?.learningFlush ? ` · ${status.learningFlush}` : '');
    const apiLink = card.querySelector('a.api');
    if (!apiLink && snap.port) {
      const a = $('a', 'api', `http://127.0.0.1:${snap.port}/v1`);
      a.href = a.textContent;
      card.querySelector('.m').after(a);
    }
    const metrics = card.querySelector('.metrics');
    metrics.textContent = '';
    const live = status?.metrics?.live;
    if (live) {
      for (const [label, value, digits] of [['解码', live.decode_tok_s, 1], ['命中率', live.hit_rate, 3]]) {
        if (typeof value !== 'number') continue;
        const m = $('span'); m.append(document.createTextNode(label + ' '));
        m.appendChild($('b', null, value.toFixed(digits)));
        metrics.appendChild(m);
      }
    }
    if (['stopped', 'exited', 'error'].includes(state)) {
      clearInterval(runTimers.get(id)); runTimers.delete(id);
      loadRuns();
    }
  };
  tick();
  runTimers.set(id, setInterval(tick, 2000));
}

/* 模型配置 */
async function loadProfiles() {
  const box = document.getElementById('profiles');
  box.textContent = '';
  let list;
  try { list = await api('GET', '/api/list'); }
  catch (error) { box.appendChild($('div', 'banner bad')).append(document.createTextNode(error.message)); return; }
  if (!Array.isArray(list) || !list.length) { box.appendChild($('div', 'card empty', '没有可用的模型配置。')); return; }
  const grid = $('div', 'grid');
  for (const profile of list) grid.appendChild(profileCard(profile));
  box.appendChild(grid);
}
function profileCard(profile) {
  const card = $('div', 'card pcard');
  card.appendChild($('h3', null, profile.id));
  card.appendChild($('span', 'badge quant', profile.quant ?? '?'));
  card.appendChild($('div', 'path', profile.profile ?? ''));
  const actions = $('div', 'row');
  const check = $('button', 'ghost', '检查');
  const start = $('button', 'primary', '启动');
  const result = $('div', 'result');
  check.onclick = async () => {
    busy(check, true, '检查'); result.textContent = ''; result.classList.remove('err');
    try {
      const r = await api('GET', '/api/check?id=' + encodeURIComponent(profile.id));
      result.textContent = ['模型 ' + (r.model ?? '?'), '端口 ' + (r.settings?.port ?? '?'),
        '引擎 ' + (r.engineVersion ?? '?'), '视觉 ' + (r.vision === undefined ? '?' : (r.vision ? '开' : '关'))].join('\n');
    } catch (error) { result.textContent = error.message; result.classList.add('err'); }
    busy(check, false, '检查');
  };
  start.onclick = async () => {
    busy(start, true, '启动'); result.textContent = ''; result.classList.remove('err');
    try {
      const r = await api('POST', '/api/start?id=' + encodeURIComponent(profile.id));
      result.textContent = '已启动：' + (r.id ?? '');
      loadRuns();
    } catch (error) { result.textContent = error.message; result.classList.add('err'); }
    busy(start, false, '启动');
  };
  actions.append(check, start);
  card.append(actions, result);
  return card;
}

loadDoctor(); loadRuns(); loadProfiles();
setInterval(() => { if (runTimers.size) loadRuns(); }, 10000);
</script>
</body>
</html>
